/* Mobile-first polish: comfortable touch targets, compact cards, and usable forms */
.btn{min-height:42px}
.field input,.field select,.field textarea{min-height:44px}

.panel{overflow:hidden}

.page-head .actions{width:auto}
.form-actions{display:flex;gap:10px;flex-wrap:wrap}
.mobile-hint{display:none}

.farmer-pick:hover{border-color:#79b99a;background:#f7fcf9}
.farmer-pick .pick-meta{flex:1;min-width:0}
